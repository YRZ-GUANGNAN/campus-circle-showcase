<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: #FAF8F4;
    color: #111827;
    display: grid; place-items: center;
  }
  .wrap { text-align: center; }
  img.logo { width: 168px; height: 168px; border-radius: 50%; display: block; margin: 0 auto 34px; }
  h1 { font-size: 68px; line-height: 1; font-weight: 700; letter-spacing: .03em; }
  .en { margin-top: 16px; font-size: 17px; letter-spacing: .46em; color: #8A8F98; text-transform: uppercase; }
  .rule { margin: 26px auto 0; width: 56px; height: 4px; border-radius: 2px; background: #07C160; }
  .cap { margin-top: 22px; font-size: 19px; color: #6B7280; letter-spacing: .06em; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="brand-logo.png" alt="湛科万事通">
    <h1>湛科生活圈</h1>
    <div class="en">Campus Circle</div>
    <div class="rule"></div>
    <div class="cap">社区 · 二手 · 外卖与跑腿 · 校园服务 · 运营后台</div>
  </div>
</body>
</html>
