<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 500px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: #FAF8F4;
    color: #111827;
    display: flex; align-items: center;
    padding: 0 96px; gap: 52px;
  }
  img.logo { width: 156px; height: 156px; border-radius: 50%; display: block; }
  h1 { font-size: 66px; line-height: 1; font-weight: 700; letter-spacing: .03em; }
  .en { margin-top: 14px; font-size: 17px; letter-spacing: .42em; color: #8A8F98; text-transform: uppercase; }
  .rule { margin-top: 24px; width: 56px; height: 4px; border-radius: 2px; background: #07C160; }
  .cap { margin-top: 20px; font-size: 19px; color: #6B7280; letter-spacing: .06em; }
</style>
</head>
<body>
  <img class="logo" src="brand-logo.png" alt="湛科万事通">
  <div>
    <h1>湛科生活圈</h1>
    <div class="en">Campus Circle</div>
    <div class="rule"></div>
    <div class="cap">社区 · 二手 · 外卖与跑腿 · 校园服务 · 运营后台</div>
  </div>
</body>
</html>
